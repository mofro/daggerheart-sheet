name: Release Obsidian plugin

# Obsidian/BRAT require the release tag to equal the manifest version exactly
# (e.g. "0.1.0", no leading "v"). Push such a tag to cut a release, or
# trigger manually via workflow_dispatch with the version input.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match manifest.json exactly, no "v" prefix)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Audit only production deps — dev tooling (ESLint, sass, vitest) doesn't
      # ship in main.js and its advisories shouldn't block a user-facing release.
      - name: Audit dependencies
        run: bun audit --production

      - name: Verify tag matches manifest version
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          MANIFEST_VERSION="$(jq -r .version manifest.json)"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match manifest.json version '$MANIFEST_VERSION'."
            echo "Tag the commit with exactly the manifest version (no 'v' prefix)."
            exit 1
          fi

      - name: Build (production)
        run: bun run build:prod

      - name: Build release notes from changelog
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          NOTES="$(awk -v tag="$TAG" '$1 == "##" && $2 == tag {grab=1; next} $1 == "##" {grab=0} grab' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Daggerheart Sheet $TAG."
          fi
          {
            printf '%s\n\n' "$NOTES"
            printf 'Install the three attached files into `<vault>/.obsidian/plugins/daggerheart-sheet/`, or add the repo via BRAT.\n'
          } > RELEASE_NOTES.md

      - name: Ensure tag exists at HEAD (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # Remove from remote (ignore 404 if it never existed)
          gh api repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG --method DELETE 2>/dev/null || true
          # Remove from local checkout (fetch-depth:0 brings all tags down)
          git tag -d "$TAG" 2>/dev/null || true
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file RELEASE_NOTES.md \
            main.js styles.css manifest.json
